<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pattern N — Star counter (Anime.js v4)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Geist', system-ui, sans-serif; background: #fafaf7; color: #09090b; margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .lead { font-family: 'Geist Mono', monospace; font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 24px; }
  #stage { position: relative; width: 720px; max-width: 100%; height: 320px; display: flex; align-items: center; justify-content: center; overflow: visible; }
  .star-button { --bg-1: #212830; --bg-2: #3D444D; position: absolute; display: flex; align-items: center; justify-content: space-between; min-width: 220px; background: var(--bg-1); border: 2px solid var(--bg-2); border-radius: 10px; padding: 8px 30px 8px 22px; font-family: system-ui, sans-serif; font-size: 26px; color: #fff; height: 56px; transform-origin: 50% 50%; }
  .star-button .label { padding: 0 20px; width: 120px; text-align: center; }
  .star-button .count { position: relative; padding: 0 10px; min-width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
  .star-button .count::before { content: ""; position: absolute; z-index: -1; top: -2px; left: -4px; right: -4px; bottom: -2px; border-radius: 20px; background: var(--bg-2); }
  .star-icon { width: 36px; height: 36px; color: #E3B342; }
  .star-icon polygon { transform-box: fill-box; transform-origin: 50% 50%; }
  .star-particle { position: absolute; width: 36px; height: 36px; overflow: visible; pointer-events: none; }
  .controls { margin-top: 32px; display: flex; gap: 8px; }
  .btn { background: #fff; border: 1px solid #d4d4d8; color: #3f3f46; font-family: 'Geist Mono', monospace; font-size: 12px; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 120ms; }
  .btn:hover { background: #fafaf7; }
</style>
</head>
<body>
  <p class="lead">Pattern N — Numeric counter (50K stars)</p>
  <div id="stage">
    <div class="star-button">
      <svg class="star-icon" viewBox="0 0 36 36"><polygon stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" points="8.75 32.64 10.39 22.29 3 15.01 13.40 13.43 18 4 22.60 13.43 33 15.01 25.61 22.22 27.24 32.64 18 27.79"/></svg>
      <span class="label">Star</span>
      <span class="count">0</span>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="play">▶ Play</button>
    <button class="btn" id="restart">↻ Restart</button>
  </div>

  <script type="module">
    import { animate, createTimeline, utils } from "https://esm.sh/animejs@4.1.4";


      // Export hook: expose timeline + honor ?clean=1
      const params = new URLSearchParams(location.search);
      const clean = params.get('clean') === '1';
      if (clean) document.querySelectorAll('.controls, .sm-controls, [data-controls]').forEach(el => el.style.display = 'none');

    const stage = document.getElementById("stage");
    const button = stage.querySelector(".star-button");
    const label = stage.querySelector(".label");
    const count = stage.querySelector(".count");
    const starIcon = stage.querySelector(".star-icon");
    const starPoly = stage.querySelector(".star-icon polygon");

    let masterTimeline = null;

    function spawnStarParticle() {
      const clone = starIcon.cloneNode(true);
      clone.classList.add("star-particle");
      stage.appendChild(clone);
      const left = button.offsetLeft + 4;
      animate(clone, {
        translateY: { to: utils.random(-200, -260), ease: "out" },
        translateX: [
          { from: left, to: left + utils.random(-50, 50), ease: "out" },
          { to: left + utils.random(-50, 50), ease: "inOut(2)" },
        ],
        color: { from: "#FFDD8E" },
        scale: [1, 1.2, 1, .8],
        opacity: [1, 0],
        duration: 1200,
        ease: "inOut(2)",
        onComplete: () => clone.remove(),
      });
    }

    function buildTimeline() {
      // Reset
      count.textContent = "0";
      starPoly.setAttribute("fill", "none");
      label.textContent = "Star";

      const tl = createTimeline({ autoplay: false });
      window.timeline = tl;

      // Step 1: First star (slow click)
      tl.add(button, { scale: [1, .94, 1], duration: 600, ease: "out(4)" })
        .set(count, { textContent: "1" }, "+=0")
        .call(() => {
          label.textContent = "Starred";
          starPoly.setAttribute("fill", "currentColor");
          spawnStarParticle();
        }, "-=400");

      // Step 2: ramp up 1 → 5
      tl.label("warmup", "+=300");
      for (let i = 2; i <= 5; i++) {
        tl.set(count, { textContent: i }, `warmup+=${(i - 2) * 100}`);
        tl.call(spawnStarParticle, `warmup+=${(i - 2) * 100}`);
      }

      // Step 3: Counter goes wild 5 → 49999 (exponential ramp)
      tl.add(count, {
        textContent: [5, 40000],
        modifier: (v) => Math.round(v).toLocaleString(),
        ease: "cubicBezier(1,0,1,1)",
        duration: 5000,
      }, "warmup+=500");

      // Step 4: Settle 40000 → 49999 (slow approach)
      tl.add(count, {
        textContent: [40000, 49999],
        modifier: (v) => Math.round(v).toLocaleString(),
        ease: "cubicBezier(0,1,0,1)",
        duration: 4200,
      }, "<");

      // Step 5: Snap to 50,000
      tl.set(count, { textContent: "50,000" }, "<+=4500");
      tl.add(button, { scale: [1, .94, 1], duration: 600, ease: "out(4)" }, "<")
        .call(spawnStarParticle, "<");

      // Background: continuous star spawn during the wild ramp
      const burst = createTimeline({ autoplay: false, loop: 60, onLoop: (self) => spawnStarParticle() });
      burst.add(button, { scale: [1, .985, 1], rotate: () => utils.random(-1.5, 1.5), duration: 150, ease: "out(4)" });
      tl.add(burst, { progress: 1, duration: 9000, ease: "cubicBezier(.65,0,0,1)" }, "warmup+=500");

      return tl;
    }

    function play() {
      if (masterTimeline) masterTimeline.pause();
      masterTimeline = buildTimeline();
      masterTimeline.play();
    }

    document.getElementById("play").addEventListener("click", play);
    document.getElementById("restart").addEventListener("click", play);

    document.fonts.ready.then(() => setTimeout(play, 300));
  </script>
</body>
</html>
