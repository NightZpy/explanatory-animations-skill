<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pattern O — Shape drift (Anime.js v4)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Geist', system-ui, sans-serif; background: #0f0f17; color: #f4f4f5; margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .lead { font-family: 'Geist Mono', monospace; font-size: 11px; color: rgba(244,244,245,.5); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 24px; }
  .layered-animations {
    position: relative;
    width: 16rem;
    height: 16rem;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: scale(1.75);
  }
  .shape { position: absolute; overflow: visible; width: 8rem; height: 8rem; stroke: currentColor; fill: transparent; will-change: transform; }
  .shape.small { width: 1.5rem; height: 1.5rem; stroke-width: 2px; fill: currentColor; }
  .color-cyan { color: #22d3ee; }
  .color-magenta { color: #e879f9; }
  .color-amber { color: #eab308; }
  .shape polygon, .shape rect, .shape circle { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
  <p class="lead">Pattern O — Shape morph / layered transforms</p>
  <div class="layered-animations">
    <svg class="shape small color-cyan" viewBox="0 0 96 96"><rect width="48" height="48" x="24" y="24"/></svg>
    <svg class="shape small color-magenta" viewBox="0 0 96 96"><polygon points="48 17.28 86.4 80.12 9.6 80.12"/></svg>
    <svg class="shape small color-amber" viewBox="0 0 96 96"><circle cx="48" cy="48" r="32"/></svg>
    <svg class="shape color-cyan" viewBox="0 0 96 96"><circle cx="48" cy="48" r="28" stroke-width="2"/></svg>
    <svg class="shape color-magenta" viewBox="0 0 96 96"><rect width="48" height="48" x="24" y="24" stroke-width="2"/></svg>
    <svg class="shape color-amber" viewBox="0 0 96 96"><polygon points="48 17.28 86.4 80.12 9.6 80.12" stroke-width="2"/></svg>
  </div>

  <script type="module">
    import { createTimeline, utils, createSpring } from "https://esm.sh/animejs@4.1.4";


      // Export hook: expose timeline + honor ?clean=1
      const params = new URLSearchParams(location.search);
      const clean = params.get('clean') === '1';
      if (clean) document.querySelectorAll('.controls, .sm-controls, [data-controls]').forEach(el => el.style.display = 'none');

    const shapes = document.querySelectorAll(".shape");
    const eases = ["inOutQuad", "inOutCirc", "inOutSine", createSpring()];
    const trianglePoints = [48, 17.28, 86.4, 80.12, 9.6, 80.12];

    function makeKeyframes(valueFn) {
      const kf = [];
      for (let i = 0; i < 80; i++) {
        kf.push({ to: valueFn(), ease: utils.randomPick(eases), duration: utils.random(400, 1800) });
      }
      return kf;
    }

    function animateShape(el) {
      const circle = el.querySelector("circle");
      const rect = el.querySelector("rect");
      const poly = el.querySelector("polygon");

      const tl = createTimeline({ onComplete: () => animateShape(el) })
        .add(el, {
          translateX: makeKeyframes(() => utils.random(-3, 3) + "rem"),
          translateY: makeKeyframes(() => utils.random(-3, 3) + "rem"),
          rotate: makeKeyframes(() => utils.random(-180, 180)),
        }, 0);
      window.timeline = tl;

      if (circle) tl.add(circle, {
        r: makeKeyframes(() => utils.random(24, 56)),
      }, 0);

      if (rect) tl.add(rect, {
        width: makeKeyframes(() => utils.random(56, 96)),
        height: makeKeyframes(() => utils.random(56, 96)),
      }, 0);

      if (poly) tl.add(poly, {
        points: makeKeyframes(() => {
          const s = utils.random(0.9, 1.6, 3);
          return `${trianglePoints[0]*s} ${trianglePoints[1]*s} ${trianglePoints[2]*s} ${trianglePoints[3]*s} ${trianglePoints[4]*s} ${trianglePoints[5]*s}`;
        }),
      }, 0);
    }

    shapes.forEach(animateShape);
  </script>
<script src="../widget-helpers/export-button.js" defer></script>
</body>
</html>
