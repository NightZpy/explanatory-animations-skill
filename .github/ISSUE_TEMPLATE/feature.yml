name: ✨ Feature / new pattern
description: Suggest a new pattern, palette, export strategy, or improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of addition?
      options:
        - "New animation pattern (Q, R, …)"
        - "New palette / typography preset"
        - "New export strategy"
        - "Existing pattern improvement"
        - "Tooling / scripts improvement"
        - "Docs improvement"
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When would you use this?
      description: Concrete topic or scenario this addition unlocks that the existing 16 patterns can't cover well.
    validations:
      required: true
  - type: textarea
    id: against-existing
    attributes:
      label: Why not an existing pattern?
      description: For new patterns, contrast with the closest 2–3 existing patterns and explain why this is distinct.
  - type: textarea
    id: design
    attributes:
      label: Rough design / inputs
      description: For new patterns, sketch the inputs the user must provide + the visual structure + the animation choreography.
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art / references
      description: Links to similar effects in ByteByteGo / Stripe Docs / 3Blue1Brown / MDN / codepen.io.
